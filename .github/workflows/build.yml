name: Void FPS Boost - Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP project tidak dijumpai."
            ls -la
            exit 1
          fi

          echo "ZIP dijumpai: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "ZIP berjaya diextract."
          find extracted -maxdepth 4 -type f | head -100

      - name: Find Android Project
        shell: bash
        run: |
          set -e

          FOUND=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "*/.git/*" | head -n 1)

          if [ -z "$FOUND" ]; then
            echo "ERROR: Android Gradle project tidak dijumpai selepas extract."
            echo ""
            echo "Struktur fail:"
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$FOUND")

          echo "Android project dijumpai:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Android Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Project:"
          pwd

          echo ""
          echo "Files:"
          ls -la

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle tidak dijumpai."
            exit 1
          fi

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building APK..."

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Mencari APK..."

          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak berjaya dihasilkan."
            exit 1
          fi

          echo "APK dijumpai:"
          echo "$APK"

          mkdir -p output
          cp "$APK" output/VoidFPSBoost.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoidFPSBoost-APK
          path: output/VoidFPSBoost.apk
          if-no-files-found: error
