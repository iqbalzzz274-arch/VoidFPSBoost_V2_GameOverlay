name: Void FPS Boost - Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show Project Files
        shell: bash
        run: |
          echo "===== ROOT ====="
          pwd
          echo "===== FILES ====="
          find . -maxdepth 3 -type f \
            ! -path './.git/*' \
            | sort | head -300

      - name: Extract ZIP Project
        shell: bash
        run: |
          mkdir -p extracted

          found_zip=""

          for zip in ./*.zip; do
            if [ -f "$zip" ]; then
              found_zip="$zip"
              break
            fi
          done

          if [ -n "$found_zip" ]; then
            echo "Found ZIP: $found_zip"
            unzip -o "$found_zip" -d extracted
          else
            echo "No ZIP found. Using repository files directly."
          fi

      - name: Find Android Project
        id: find_project
        shell: bash
        run: |
          echo "Searching for Gradle Android project..."

          PROJECT_DIR=""

          # Search settings.gradle / settings.gradle.kts
          while IFS= read -r settings_file; do
            dir="$(dirname "$settings_file")"

            if [ -f "$dir/settings.gradle" ] || \
               [ -f "$dir/settings.gradle.kts" ]; then

              if [ -f "$dir/build.gradle" ] || \
                 [ -f "$dir/build.gradle.kts" ]; then

                PROJECT_DIR="$dir"
                break
              fi
            fi
          done < <(
            find . -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              ! -path './.git/*' \
              ! -path './extracted/.gradle/*' \
              | sort
          )

          # If settings.gradle wasn't found, search for app/build.gradle
          if [ -z "$PROJECT_DIR" ]; then
            while IFS= read -r app_gradle; do
              dir="$(dirname "$(dirname "$app_gradle")")"

              if [ -f "$dir/build.gradle" ] || \
                 [ -f "$dir/build.gradle.kts" ]; then

                PROJECT_DIR="$dir"
                break
              fi
            done < <(
              find . -type f \
                \( -path "*/app/build.gradle" -o -path "*/app/build.gradle.kts" \) \
                ! -path './.git/*' \
                | sort
            )
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android Gradle project was not found."
            echo "Available Gradle files:"
            find . -type f \
              \( -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \) \
              ! -path './.git/*' \
              | sort
            exit 1
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "======================================"
          echo "ANDROID PROJECT FOUND:"
          echo "$PROJECT_DIR"
          echo "======================================"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Check Gradle Version
        shell: bash
        run: |
          gradle --version

      - name: Build APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.find_project.outputs.project_dir }}
        run: |
          cd "$PROJECT_DIR"

          echo "Building project:"
          pwd

          echo "===== PROJECT FILES ====="
          find . -maxdepth 3 -type f \
            ! -path './.gradle/*' \
            | sort | head -300

          echo "===== BUILD ====="

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            echo "gradlew not found."
            echo "Using installed Gradle 8.9."
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Find APK
        id: find_apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.find_project.outputs.project_dir }}
        run: |
          echo "Searching for APK..."

          APK=""

          APK="$(find "$PROJECT_DIR" -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            ! -path "*/build/intermediates/*" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            APK="$(find "$PROJECT_DIR" -type f \
              -name "*.apk" \
              ! -path "*/build/intermediates/*" \
              | head -n 1)"
          fi

          if [ -z "$APK" ]; then
            echo "::error::APK was not found."
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Void-FPS-Boost-Debug-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
