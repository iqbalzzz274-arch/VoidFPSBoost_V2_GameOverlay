name: Void FPS Boost - Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show Project Files
        shell: bash
        run: |
          echo "===== CURRENT DIRECTORY ====="
          pwd

          echo "===== ROOT FILES ====="
          find . -maxdepth 3 -type f \
            ! -path './.git/*' \
            | sort | head -300

      - name: Extract ZIP Project
        shell: bash
        run: |
          mkdir -p extracted

          FOUND_ZIP=""

          for ZIP_FILE in ./*.zip; do
            if [ -f "$ZIP_FILE" ]; then
              FOUND_ZIP="$ZIP_FILE"
              break
            fi
          done

          if [ -n "$FOUND_ZIP" ]; then
            echo "ZIP FOUND:"
            echo "$FOUND_ZIP"

            unzip -o "$FOUND_ZIP" -d extracted

            echo "===== EXTRACTED FILES ====="
            find extracted -maxdepth 4 -type f \
              | sort | head -300
          else
            echo "No ZIP found."
          fi

      - name: Find Android Project
        id: find_project
        shell: bash
        run: |
          echo "===== SEARCHING FOR ANDROID PROJECT ====="

          PROJECT_DIR=""

          # Search for settings.gradle / settings.gradle.kts
          while IFS= read -r SETTINGS_FILE; do
            DIR="$(dirname "$SETTINGS_FILE")"

            if [ -f "$DIR/settings.gradle" ] || \
               [ -f "$DIR/settings.gradle.kts" ]; then

              if [ -f "$DIR/build.gradle" ] || \
                 [ -f "$DIR/build.gradle.kts" ]; then

                PROJECT_DIR="$DIR"
                break
              fi
            fi
          done < <(
            find . \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              ! -path './.git/*' \
              ! -path '*/.gradle/*' \
              | sort
          )

          # If settings.gradle wasn't found,
          # search for app/build.gradle
          if [ -z "$PROJECT_DIR" ]; then
            while IFS= read -r APP_GRADLE; do
              DIR="$(dirname "$(dirname "$APP_GRADLE")")"

              if [ -f "$DIR/build.gradle" ] || \
                 [ -f "$DIR/build.gradle.kts" ]; then

                PROJECT_DIR="$DIR"
                break
              fi
            done < <(
              find . \
                -type f \
                \( -path "*/app/build.gradle" \
                -o -path "*/app/build.gradle.kts" \) \
                ! -path './.git/*' \
                ! -path '*/.gradle/*' \
                | sort
            )
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android Gradle project was NOT found."

            echo "===== GRADLE FILES FOUND ====="

            find . \
              -type f \
              \( -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \) \
              ! -path './.git/*' \
              ! -path '*/.gradle/*' \
              | sort

            exit 1
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "======================================"
          echo "ANDROID PROJECT FOUND:"
          echo "$PROJECT_DIR"
          echo "======================================"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Check Gradle 8.9
        shell: bash
        run: |
          gradle --version

      - name: Build APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.find_project.outputs.project_dir }}
        run: |
          cd "$PROJECT_DIR"

          echo "===== BUILD DIRECTORY ====="
          pwd

          echo "===== PROJECT FILES ====="
          find . -maxdepth 3 -type f \
            ! -path './.gradle/*' \
            | sort | head -300

          echo "===== BUILD APK ====="

          if [ -f "./gradlew" ]; then
            echo "Using Gradle Wrapper."

            chmod +x ./gradlew

            ./gradlew \
              --no-daemon \
              --stacktrace \
              assembleDebug
          else
            echo "Gradle Wrapper not found."
            echo "Using installed Gradle 8.9."

            gradle \
              --no-daemon \
              --stacktrace \
              assembleDebug
          fi

      - name: Find APK
        id: find_apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.find_project.outputs.project_dir }}
        run: |
          echo "===== SEARCHING FOR APK ====="

          APK=""

          APK="$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            ! -path "*/build/intermediates/*" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            APK="$(find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              ! -path "*/build/intermediates/*" \
              | head -n 1)"
          fi

          if [ -z "$APK" ]; then
            echo "::error::APK was NOT found."

            echo "===== BUILD OUTPUTS ====="

            find "$PROJECT_DIR" \
              -type f \
              -path "*/build/*" \
              | sort | tail -200

            exit 1
          fi

          echo "======================================"
          echo "APK FOUND:"
          echo "$APK"
          echo "======================================"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Void-FPS-Boost-Debug-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
